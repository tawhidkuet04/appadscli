version: 2
project_name: appadscli

builds:
  - main: .
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tawhidkuet04/appadscli/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: tawhidkuet04
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tawhidkuet04/appadscli
    description: "Your App Store growth stack in one binary — ASO + Apple Ads CLI"
    license: MIT
    test: |
      system "#{bin}/appadscli --version"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
